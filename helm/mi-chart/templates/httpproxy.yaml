apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: operaciones
spec:
  virtualhost:
    fqdn: {{ .Values.httpproxy.fqdn }}
  routes:
    - conditions:
      - prefix: /m3
      services:
        - name: mult
          port: 80
      pathRewritePolicy:
        replacePrefix:
        - replacement: /multiplica
    - conditions:
      - prefix: /p
      services:
        - name: primos
          port: 80
      pathRewritePolicy:
        replacePrefix:
        - replacement: /primos
