apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: host-ingress
spec:
  ingressClassName: contour
  defaultBackend:
    service:
      name: multiplica
      port:
        number: 8080
  rules:
  - host: multiplica.gz.com
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: multiplica
            port:
              number: 8080
  - host: primos.gz.com
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: primos
            port:
              number: 8080