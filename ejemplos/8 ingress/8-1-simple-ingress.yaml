apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-ingress
  annotations:
    kubernetes.io/ingress.class: contour
spec:
  rules:
    - host: gz.com
      http:
        paths:
          - path: /multiplica
            pathType: Prefix
            backend:
              service:
                name: multiplica
                port:
                  number: 8080
          - path: /primos
            pathType: Prefix
            backend:
              service:
                name: primos
                port:
                  number: 8080
    - host: multiplica.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: multiplica
                port:
                  number: 8080
    - host: primos.gz.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: primos
                port:
                  number: 8080
