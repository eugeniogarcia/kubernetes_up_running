kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: default
  name: pod-and-services
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: default
  name: pods-and-services
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: alice
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: mydevs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-and-services
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access-primos
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["primos"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access-mult
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["mult2", "mult3"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-access-primos-to-user
  namespace: default
subjects:
  - kind: User
    name: user-primos
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: access-primos
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-access-mult-to-user
  namespace: default
subjects:
  - kind: User
    name: user-mult
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: access-mult
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-access-mult-to-group
  namespace: default
subjects:
  - kind: Group
    name: mult-group
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: access-mult
  apiGroup: rbac.authorization.k8s.io
