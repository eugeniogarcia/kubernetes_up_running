apiVersion: v1
kind: ServiceAccount
metadata:
  name: multiplicador-operator
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: multiplicador-operator
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get","list","watch"]
  - apiGroups: ["gz.com"]
    resources: ["multiplicadores"]
    verbs: ["get","list","watch","create","update","patch","delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: multiplicador-operator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: multiplicador-operator
subjects:
  - kind: ServiceAccount
    name: multiplicador-operator
    namespace: default

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multiplicador-operator
  namespace: default
  labels:
    app: multiplicador-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multiplicador-operator
  template:
    metadata:
      labels:
        app: multiplicador-operator
    spec:
      serviceAccountName: multiplicador-operator
      containers:
        - name: operator
          image: multiplicador-operator:local
          imagePullPolicy: IfNotPresent
          args: []
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
