apiVersion: v1
kind: PersistentVolume
metadata:
  name: k6-reports-pv
spec:
  capacity:
    storage: 20Mi # tamaño del volumen
  accessModes:
    - ReadWriteOnce # modo de acceso. Solo puede ser montado en modo lectura/escritura por un nodo
  hostPath:
    path: /data/k6-reports # ruta en el nodo donde se almacena el volumen
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain # política de retención del volumen. Retain: conservar el volumen aunque se borre el PVC. Otras opciones: Recycle, Delete
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k6-reports-pvc
spec:
  accessModes:
    - ReadWriteOnce # modo de acceso. Debe coincidir con el del PV que kubernetes asigne
  resources:
    requests:
      storage: 20Mi # tamaño solicitado al PV
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: primos-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: primos
  template:
    metadata:
      labels:
        app: primos
    spec:
      containers:
      - name: primos
        image: docker.io/egsmartin/primos:latest
        ports:
        - containerPort: 8080 # puerto del contenedor
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080 # puerto para la probe. Pasados 30 segundos tenemos 10 para contestar. Sino contestamos no se serviran peticiones
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080 # puerto para la probe. Si no se supera se destruirá y creará otro pod
          initialDelaySeconds: 5 # esperamos 5 segundos para lanzar la probe
          periodSeconds: 5 # y cada 5 segundos la comprobamos
---
apiVersion: v1
kind: Service
metadata:
  name: primos-service
spec:
  selector:
    app: primos
  ports:
  - port: 80 # puerto del servicio
    targetPort: 8080 # puerto del contenedor
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: primos-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment # Vamos a escalar un deployment (podria haber sido una replicaset)
    name: primos-deployment
  minReplicas: 1 # número mínimo de réplicas
  maxReplicas: 10 # número máximo de réplicas
  metrics:
  - type: Resource
    resource:
      name: cpu #vigilamos la cpu
      target:
        type: Utilization
        averageUtilization: 50 # no puede superar el 50% de uso de cpu
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 10  # Ventana de estabilización (5 minutos)
      policies:
      - type: Percent
        value: 50  # Reduce hasta un 50% de las réplicas actuales por minuto
        periodSeconds: 60
      - type: Pods
        value: 1  # O reduce 1 réplica por minuto, lo que sea mayor
        periodSeconds: 60
      selectPolicy: Max  # Usa la política que reduzca más
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-ingress
spec:
  ingressClassName: contour
  rules:
    - host: gz.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: primos-service
                port:
                  number: 80 # puerto donde se expone el servicio
---
apiVersion: v1
kind: Pod
metadata:
  name: pvc-debug
spec:
  containers:
  - name: sh
    image: docker.io/library/busybox:stable
    imagePullPolicy: IfNotPresent
    command: ["sh","-c","sleep 3600"]
    volumeMounts: # montamos el volumen en el path /mnt/reports
    - name: reports # nombre del volumen que montamos
      mountPath: /mnt/reports
  volumes:
  - name: reports # datos del volumen
    persistentVolumeClaim:
      claimName: k6-reports-pvc # usamos el mismo pvc que uso el runner de k6 para guardar los reportes
  restartPolicy: Never